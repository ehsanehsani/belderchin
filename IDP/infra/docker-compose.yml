services:
  postgres:
    build: 
      context: ./postgres-init
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ory
      POSTGRES_PASSWORD: ory
      POSTGRES_DB: ory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ory"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - belderchin-idp
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: docker.tapsifood.cloud/library/redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - belderchin-idp
    volumes:
      - redis_data:/data

  couchbase:
    image: docker.arvancloud.ir/couchbase:7.2.0
    ports:
      - "8091-8094:8091-8094"
      - "11210:11210"
    environment:
      - COUCHBASE_ADMINISTRATOR_USERNAME=admin
      - COUCHBASE_ADMINISTRATOR_PASSWORD=password
      - COUCHBASE_BUCKET=belderchin
      - COUCHBASE_RBAC_USERNAME=admin
      - COUCHBASE_RBAC_PASSWORD=password
      - COUCHBASE_RBAC_NAME=admin
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/pools/default"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - belderchin-idp
    volumes:
      - couchbase_data:/opt/couchbase/var
    depends_on:
      - postgres

  kratos-migrate:
    image: docker.arvancloud.ir/oryd/kratos:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: postgres://ory:ory@postgres:5432/ory_kratos?sslmode=disable
    command: ["migrate", "sql", "-e", "--read-from-env", "--yes"]
    networks:
      - belderchin-idp

  kratos:
    image: docker.arvancloud.ir/oryd/kratos:latest
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    environment:
      DSN: postgres://ory:ory@postgres:5432/ory_kratos?sslmode=disable
    volumes:
      - ./kratos:/etc/config/kratos
    command: ["serve", "--config", "/etc/config/kratos/kratos.yml"]
    ports:
      - "4433:4433" # public
      - "4434:4434" # admin
    networks:
      - belderchin-idp

  hydra-migrate:
    image: docker.arvancloud.ir/oryd/hydra:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: postgres://ory:ory@postgres:5432/ory_hydra?sslmode=disable
    command: ["migrate", "sql", "-e", "--read-from-env", "--yes"]
    networks:
      - belderchin-idp

  hydra:
    image: docker.arvancloud.ir/oryd/hydra:latest
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    environment:
      DSN: postgres://ory:ory@postgres:5432/ory_hydra?sslmode=disable
    volumes:
      - ./hydra:/etc/config/hydra
    command: ["serve", "all", "--config", "/etc/config/hydra/hydra.yml", "--dev"]
    ports:
      - "4444:4444" # public
      - "4445:4445" # admin
    networks:
      - belderchin-idp

  mailhog:
    image: docker.tapsifood.cloud/library/mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - belderchin-idp

  auth-bridge:
    build:
      context: ./auth-bridge
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: noreply@belderchin.local
      JWT_KEY: "belderchin-secret-key-1234567890-abcdefghijklmnopqrstuvwxyz-12"
      JWT_ISSUER: "belderchin"
      JWT_AUDIENCE: "belderchin-users"
    depends_on:
      - kratos
      - hydra
      - mailhog
      - redis
    networks:
      - belderchin-idp

  backend:
    build:
      context: ./backend
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      COUCHBASE_CONNECTIONSTRING: couchbase://couchbase
      COUCHBASE_USERNAME: admin
      COUCHBASE_PASSWORD: password
      COUCHBASE_BUCKETNAME: belderchin
      REDIS_CONNECTIONSTRING: redis:6379
      JWT_KEY: "belderchin-secret-key-1234567890-abcdefghijklmnopqrstuvwxyz-12"
      JWT_ISSUER: "belderchin"
      JWT_AUDIENCE: "belderchin-users"
    depends_on:
      - couchbase
      - redis
      - auth-bridge
    networks:
      - belderchin-idp

  sms-service:
    build:
      context: ./sms-service
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    networks:
      - belderchin-idp

  oathkeeper:
    image: docker.arvancloud.ir/oryd/oathkeeper:latest
    ports:
      - "4455:4455" # public
      - "4456:4456" # api
    command: ["serve", "-c", "/etc/config/oathkeeper/oathkeeper.yml"]
    volumes:
      - ./oathkeeper:/etc/config/oathkeeper
    depends_on:
      - hydra
    networks:
      - belderchin-idp

networks:
  belderchin-idp:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  couchbase_data: